name: Build Book

# Build agentic-ai-guide-zh.pdf on every PR, push to main, or manual dispatch;
# publish it to GitHub Releases when a v* tag is pushed.
#
# The repository Makefile intentionally runs the explicit
# `xelatex -> bibtex -> xelatex x3` sequence and avoids latexmk, so CI
# calls `make dist` directly and matches the local build. The font stack in
# book.tex selects Noto CJK automatically on Linux, so no source rewriting is
# needed on the runner.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Noto CJK fonts
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -f

      - name: Compile PDF
        run: make dist

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentic-ai-guide-zh-pdf
          path: agentic-ai-guide-zh.pdf
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agentic-ai-guide-zh-pdf
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: agentic-ai-guide-zh.pdf
          generate_release_notes: true
          fail_on_unmatched_files: true
