name: Build Book

# Build agentic-ai-guide-zh.pdf on every PR, push to main/development, or
# manual dispatch; publish it to GitHub Releases when a v* tag is pushed.
#
# The repository Makefile intentionally runs the explicit
# `xelatex -> bibtex -> xelatex x3` sequence and avoids latexmk, so CI
# calls `make dist` directly and matches the local build. The font stack in
# book.tex selects Noto CJK automatically on Linux, so no source rewriting is
# needed on the runner.
#
# TeX Live is pinned to the frozen TL2025 historic image instead of `latest`;
# for byte-reproducible builds, pin the image digest as well.

on:
  pull_request:
  push:
    branches: [main, update-latest-zh]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:TL2025-historic
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Noto CJK fonts
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -f

      - name: Verify CJK fonts
        run: |
          fc-list : family | grep -qi 'Noto Serif CJK SC'
          fc-list : family | grep -qi 'Noto Sans CJK SC'

      - name: Compile PDF
        run: make dist

      - name: Verify build output
        run: |
          test -s agentic-ai-guide-zh.pdf
          test -s book.log
          if grep -E 'Citation .* undefined|Reference .* undefined|Missing character' book.log; then
            echo "Build log contains unresolved references or missing glyphs"; exit 1
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentic-ai-guide-zh-pdf
          path: agentic-ai-guide-zh.pdf
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agentic-ai-guide-zh-pdf
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: agentic-ai-guide-zh.pdf
          generate_release_notes: true
          fail_on_unmatched_files: true
